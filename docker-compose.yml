# docker-compose is for the Evaluation Worker only.
# The database is MongoDB Atlas (cloud) — no local DB container needed.
#
# NOT deployed to Vercel. Run on a Docker-capable host (Railway / Fly.io / VPS).

services:
  evaluation-worker:
    build:
      context: .
      dockerfile: services/evaluation-worker/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: "${DATABASE_URL}"
      SECRETS_ENCRYPTION_KEY: "${SECRETS_ENCRYPTION_KEY}"
      WORKER_SECRET: "${WORKER_SECRET:-dev-worker-secret}"
      DOCKER_ENABLED: "true"
      DOCKER_NETWORK: rep-protocol-net
      AGENT_RUNNER_IMAGE: rep-protocol/agent-runner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rep-protocol-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  rep-protocol-net:
    name: rep-protocol-net
